# Horror Nonogram web database (created by db/create-database.sql).
# The original course database was jdbc:postgresql://localhost:5432/gamestudio_jpa — left untouched.
# Connection comes from environment variables; the defaults suit a local PostgreSQL with trust auth.
# The password is never stored in the repository: set DB_PASSWORD on a server.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/horror_nonogram}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver


# Tables are created/updated from the entities (users, score, comment, rating).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Fill the database with labelled demo players, scores and comments if they are not there yet.
nonogram.demo-data=true
